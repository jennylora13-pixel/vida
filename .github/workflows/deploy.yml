name: Publicar no GitHub Pages

# Compila e publica o app a cada push na branch de trabalho.
# O build roda nos servidores do GitHub (grátis) — nada é feito localmente.

on:
  push:
    branches: ["claude/planner-vida-improvements-3bhgl6"]
  workflow_dispatch: {}

# Permissões que o deploy do Pages exige
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy de cada vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      # Descobre o caminho certo pelo nome do repositório:
      # - repo "usuario.github.io"  -> site na raiz  -> base "/"
      # - qualquer outro nome (ex: vida) -> base "/<repo>/"
      - name: Compilar o app
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            BASE="/"
          else
            BASE="/$REPO/"
          fi
          echo "Publicando com base=$BASE"
          npm run build -- --base="$BASE"

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
